# Supply-chain hardening.
minimumReleaseAge: 1440
trustPolicy: no-downgrade
strictDepBuilds: true
dangerouslyAllowAllBuilds: false
blockExoticSubdeps: true
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
verifyDepsBeforeRun: error
# Reviewed benign trust downgrades (publish-method changes, not takeovers).
trustPolicyExclude:
  - 'undici-types@6.21.0' # provenance -> none; @types/node's pinned transitive dep, published 2023 (pre-provenance rollout), repo is nodejs/undici

packages:
  - packages/*

catalog:
  typescript: ^7.0.2
  tsdown: ^0.23.0
  vitest: ^5.0.0
  oxlint: ^1.82.0
  oxlint-tsgolint: ^7.0.2001
  oxfmt: ^0.67.0
  publint: ^0.3.24
  '@arethetypeswrong/cli': ^0.18.5
  '@changesets/cli': ^2.31.1
  '@changesets/changelog-github': ^0.7.0
  '@types/node': ^22.20.2
  drizzle-orm: ^0.45.2
  postgres: ^3.4.9
  pg: ^8.23.0
  '@types/pg': ^8.23.1
  better-auth: ^1.7.4
  nodemailer: ^10.0.9
  html-to-text: ^10.0.1
  '@types/html-to-text': ^9.0.4
  react: ^19.2.0
  react-dom: ^19.2.0
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
