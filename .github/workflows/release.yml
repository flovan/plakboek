name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      # Third-party actions are referenced by major version tag for Phase 1
      # (user decision, 2026-09-13); pinning by commit SHA is a deferred
      # follow-up (T-01-48).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update the Version packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run release:version
          commit: "ci: version packages"
          title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: CI
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: [version, ci]
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      # No dependency caching in this job: it is the only one that holds
      # id-token: write. actions/cache (which setup-node's `cache` input
      # wraps) restores across branches/PRs of this repo, so a cache entry
      # poisoned from a lower-privilege branch could otherwise be restored
      # here and run with OIDC publish credentials. The version and ci jobs
      # keep `cache: pnpm` -- they never hold id-token: write.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - id: npm-version
        run: echo "version=$(npm --version)" >> "$GITHUB_OUTPUT"
      - name: Verify npm meets the trusted-publishing floor (>=11.5.1)
        run: |
          node -e "
            const [major, minor, patch] = process.env.NPM_VERSION.split('.').map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            process.exit(ok ? 0 : 1);
          "
        env:
          NPM_VERSION: ${{ steps.npm-version.outputs.version }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/release/publish-unpublished.ts

  # After a release, scaffold a host the way a developer does, from the real
  # registry, and repeat the fresh-install proof. It holds no publishing
  # credential, so it may use the dependency cache.
  smoke:
    name: Registry smoke test
    needs: [version, publish]
    if: needs.version.outputs.hasChangesets == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCAFFOLD_DATABASE_URL: postgres://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read the released version
        run: echo "VERSION=$(node -p "require('./packages/create-plakboek/package.json').version")" >> "$GITHUB_ENV"
      - name: Wait for the release on the registry
        run: |
          for attempt in $(seq 1 40); do
            if npm view "create-plakboek@$VERSION" version > /dev/null 2>&1; then
              exit 0
            fi
            echo "create-plakboek@$VERSION is not on the registry yet (attempt $attempt of 40)"
            sleep 15
          done
          echo "create-plakboek@$VERSION did not appear within 10 minutes" >&2
          exit 1
      - name: Scaffold from the registry and run the fresh-install proof
        run: bash scripts/verify-scaffold.sh --registry "$VERSION"
