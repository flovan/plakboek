# Deploys every push to main once the CI workflow has passed on that commit:
# build the image, push it to GitHub's container registry, then run
# scripts/deploy.sh against your server. See DEPLOY.md for the one-time setup.
#
# Ordering: runs queue one at a time in push order, and a deploy only goes ahead
# while its commit is still the tip of main, so an older commit never replaces a
# newer one.
name: Deploy

on:
  push:
    branches: [main]

# Nothing is granted by default; each job asks for what it needs.
permissions: {}

# Whole runs queue in push order: a newer push replaces a run that is still
# waiting, and a running deploy is never cancelled.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  image:
    name: Image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha,format=long,prefix=
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - id: ref
        name: Record the pushed image
        run: printf 'image=%s\n' "${TAGS%%$'\n'*}" >> "$GITHUB_OUTPUT"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

  deploy:
    name: Deploy
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Skip unless this commit is still the tip of main
        id: tip
        shell: bash
        run: |
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [[ ! "$tip" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]; then
            echo "::error::Could not read the tip of main, so nothing was deployed."
            exit 1
          fi
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA is no longer the tip of main ($tip is), so it is not deployed. The newer run deploys."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Check out the commit
        if: steps.tip.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Write the deploy key and the pinned host key
        if: steps.tip.outputs.current == 'true'
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      - name: Deploy
        if: steps.tip.outputs.current == 'true'
        run: bash scripts/deploy.sh
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          PLAKBOEK_IMAGE: ${{ needs.image.outputs.image }}
          REGISTRY_HOST: ghcr.io
          # The registry login checks only the token, and the repository owner is a
          # GitHub login, so it never carries the brackets of a bot name.
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSH_KEY_FILE: ${{ runner.temp }}/deploy_key
          KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
